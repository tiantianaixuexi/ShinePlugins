[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-novel-studio-backend"
version = "0.1.0"
description = "AI Novel Studio backend: projects, long-form memory, RAG, storyboards, workflows and media orchestration."
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "python-multipart==0.0.33",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "aiosqlite==0.22.1",
    "greenlet==3.5.6",
    "sqlite-vec==0.1.9",
    "numpy==2.5.5",
    "httpx==0.28.1",
    "openai==3.51.0",
    "tiktoken==0.14.0",
    "pillow==13.0.0",
    "pymupdf==2.1",
    "python-docx==1.2.0",
    "structlog==26.1.0",
    "jinja2==3.1.6",
    "orjson==3.13.0",
    "platformdirs==4.14.5",
    "sse-starlette==3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
    "mypy==2.4.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# The UI copy and docstrings are Chinese: fullwidth punctuation is correct
# there, so the "ambiguous unicode" rules are noise rather than signal.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]