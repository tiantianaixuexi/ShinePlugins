[package]
name = "ai-novel-studio"
version = "0.1.0"
description = "AI Novel Studio desktop shell"
authors = ["AI Novel Studio"]
edition = "2021"
rust-version = "1.93"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
tauri-plugin-shell = "2.6.0"
tauri-plugin-opener = "2.7.3"
tauri-plugin-notification = "2.8.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process", "time", "macros", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.21"
directories = "6.0.0"
# sysinfo 0.39/0.40 require rustc 1.95; 0.38.4 is the newest release that
# builds on the pinned 1.93 toolchain.
sysinfo = "0.38.4"
portpicker = "0.1.1"
uuid = { version = "1.29.2", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
# reqwest 0.13 renamed the TLS feature: `rustls-tls` became `rustls`
# (which pulls in rustls + the platform verifier). The app only talks to a
# loopback sidecar, but a TLS backend keeps the crate usable for future
# proxied/model endpoints.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

# Windows only: a job object so the Python sidecar cannot outlive a crashed app.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
]

[[bin]]
name = "ai-novel-studio"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
